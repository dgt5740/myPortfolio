          온디바이스 AI와 웹 프론트엔드에 관심이 있습니다.
          
          고성능 데이터서버에 의존하지 않고도 사용자의 기기에서 즉시 동작하는 AI 기술로 모든 사용자가 제약 없이 사용할 수 있는 AI 기술에 관심을 가지고 있습니다.
          온라인 LLM 대신 오픈소스 모델인 Ollama를 로컬에 설치하고, 학교 과제나 프로젝트를 수행해볼 예정입니다.
          TensorFlow를 활용해 간단한 이미지 분류 모델을 구현해 볼 계획입니다.
