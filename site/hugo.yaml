          enable: true
          name: "대표 활동 보기"
          url: "#projects"
          download: false
          newPage: false
        socialLinks:
          fontAwesomeIcons:
            - icon: fab fa-github
              url: https://github.com/dgt5740
            - icon: fas fa-envelope
              url: mailto:dgt5740@gmail.com

      # 2. 소개 섹션 (P71 관심 분야, P72 학습 목표 및 계획)
      about:
        enable: true
        title: "소개 (About Me)"
        image: "/images/me.png"
        content: >
          컴퓨터공학과 인공지능 기술에 깊은 관심을 가지고 실생활의 문제를 코드로 해결하는 소프트웨어 엔지니어를 지향하고 있습니다.
          <br><br>
          <b>관심 분야 (P71):</b> 웹 프론트엔드 최적화 및 사용자 인터페이스(UI/UX) 구현입니다. 다양한 디바이스 환경에서 모든 사용자가 차별 없이 빠르고 직관적으로 정보를 이용할 수 있는 접근성과 반응형 웹 구조에 깊은 매력을 느끼고 있습니다.
          <br><br>
          <b>학습 목표 및 실행 계획 (P72):</b> 향후 1년 내 웹 표준(W3C)과 웹 접근성 지침을 완벽히 준수하는 반응형 웹 서비스를 배포하는 것이 목표입니다. 이를 위해 최신 웹 프레임워크 학습과 함께 매주 1회 컴포넌트 단위 접근성 검증 실습을 진행할 계획입니다.

      # 3. 학력 섹션 (신규 부활: 전북대 재학 정보 및 전공 과목)
      education:
        enable: true
        title: "학력 (Education)"
        items:
          - title: "컴퓨터인공지능학부 (학사 과정)"
            school:
              name: "전북대학교 (Jeonbuk National University)"
              url: "https://www.jbnu.ac.kr"
            date: "2024.03 - 현재 재학 중"
            GPA: "학업 우수"
            content: |-
              주요 이수 및 학습 분야:
                - 컴퓨터 프로그래밍 및 자료구조 기초
                - 객체지향프로그래밍, 웹 프로그래밍 실습
                - 오픈소스 소프트웨어 도구 및 버전 관리(Git) 활용

      # 4. 활동 및 이력 섹션 (신규 부활: 학부 스터디 및 프로젝트)
      experience:
        enable: true
        title: "활동 및 이력 (Experience)"
        items:
          - company: "컴퓨터인공지능학부 전공 학술 스터디"
            companyUrl: "https://github.com/dgt5740"
            jobs:
              - name: "웹 개발 & 알고리즘 스터디원"
                date: "2024.03 - 현재"
                content: >
                  동료 학우들과 함께 매주 알고리즘 문제 풀이 및 웹 기초 지식을 공유하며 프로그래밍 기초 역량을 다지고 있습니다.
              - name: "초급프로젝트 개인 실습"
                date: "2026.09 - 2026.10"
                content: >
                  정적 사이트 생성기(SSG)와 GitHub Actions를 활용한 웹사이트 구축 과제를 수행하며 CI/CD 배포 파이프라인 전 과정을 실습했습니다.

      # 5. 역량 섹션 (P73 역량과 적용 사례)
      skills:
        enable: true
        title: "보유 역량 (Skills)"
        items:
          - title: "HTML/CSS & 반응형 웹"
            description: "시맨틱 마크업을 준수하며, 다양한 해상도(390px, 768px, 1440px)에 대응하는 유연한 그리드 레이아웃을 구성할 수 있습니다."
          - title: "Git & GitHub CI/CD"
            description: "버전 관리 시스템을 활용하여 변경 이력을 관리하며, GitHub Actions 워크플로를 구축해 자동 배포 환경을 구현했습니다."
          - title: "Python & 알고리즘"
            description: "기초 자료구조와 알고리즘 문제를 해결하며 논리적 사고력을 기르고, 자동화 스크립트를 작성하여 작업 효율을 높입니다."

      # 6. 대표 활동 섹션 (P74~P79 대표 활동 요건 100% 충족)
      projects:
        enable: true
        title: "대표 활동 (Projects)"
        items:
          - title: "Hugo 기반 개인 포트폴리오 웹사이트 구축 및 자동 배포"
            image: /images/projects/profile.png
            content: >
              <b>수행 시기 및 진행 상태 (P74):</b> 2026년 10월 (완료)<br>
              <b>활동 목적 (P75):</b> 정적 웹 사이트 생성기(SSG)의 빌드 원리를 이해하고, CI/CD 자동화 파이프라인과 반응형 UI를 적용한 포트폴리오 사이트를 제작하여 개인 역량을 체계적으로 전달하기 위해 수행했습니다.<br>
              <b>본인 역할 및 기여 범위 (P76):</b> 개인 프로젝트로서 기획, 테마 커스터마이징, 콘텐츠 작성, 반응형 스타일 보정, Git 버전 관리 및 배포까지 전 과정을 100% 단독 수행했습니다.<br>
              <b>수행 과정과 기술 선택 이유 (P77):</b> 빠른 빌드 속도와 정적 파일 생성 안정성이 뛰어난 Hugo를 선택하였으며, GitHub Actions 워크플로를 연동하여 main 브랜치 푸시 시 자동 배포되도록 구성했습니다.<br>
              <b>산출물과 결과 (P78):</b> HTTPS 기반 공개 웹사이트 및 GitHub 소스 저장소 (<a href="https://github.com/dgt5740/myPortfolio" target="_blank">저장소 링크</a>)<br>
              <b>배운 점과 개선 방향 (P79):</b> 템플릿 구조 커스터마이징과 웹 접근성(포커스, 명도 대비)의 중요성을 깊이 체득했습니다. 다음 단계로는 블로그 포스팅 기능과 검색 엔진 최적화(SEO)를 보완할 예정입니다.
            badges:
              - "Hugo"
              - "GitHub Actions"
              - "Web Accessibility"
            links:
              - icon: fab fa-github
                url: https://github.com/dgt5740/myPortfolio

      # 7. 수상 및 성과 섹션 (신규 부활: 교내 실습 및 성과)
      achievements:
        enable: true
        title: "수상 및 성과 (Achievements)"
        items:
          - title: "교내 프로그래밍 실습 과제 완수"
            content: "자료구조 및 프로그래밍 기초 실습을 성실히 수행하고, 과제 분석 및 보고서 작성을 통해 실무 역량을 함양했습니다."
          - title: "Hugo 오픈소스 테마 포트폴리오 구축"
            content: "GitHub Pages 기반의 반응형 개인 소개 웹사이트를 완성하고 GitHub Actions 자동 배포 파이프라인을 성공적으로 수립했습니다."
            url: "https://github.com/dgt5740/myPortfolio"

      # 8. 연락처 및 푸터
      contact:
        enable: true
        title: "연락처 (Contact)"
        content: "프로젝트 협업 및 기타 문의 사항은 이메일이나 GitHub을 통해 언제든 편하게 연락해 주세요."
        email: "dgt5740@gmail.com"
      footer:
        socialNetworks:
          github: https://github.com/dgt5740


