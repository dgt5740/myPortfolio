  # [1. 한국어 섹션 (기본 접속 화면)]
  # ------------------------------------------------------------
  ko:
    languageName: "한국어"
    weight: 1
    contentDir: "content"
    params:
      title: "양현수 포트폴리오"
      description: "초급프로젝트 과제 1 - 개인 소개 및 포트폴리오 웹사이트"
      favicon: "fav.png"
      brand:
        title: "양현수"

      # 1. 히어로 섹션 (P27 본인 GitHub 링크, P59 본인 이름)
      hero:
        enable: true
        intro: "안녕하세요"
        title: "개발자의 길을 걷고 있는"
        subtitle: "양현수 입니다."
        content: "전북대학교 / 컴퓨터인공지능학부 재학 중"
        image: /images/hero.svg
        bottomImage:
          enable: false
        roundImage: true
